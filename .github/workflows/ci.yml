name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores só para o CI; nenhum segredo real.
  DATABASE_URL: postgresql://maison:maison_ci@localhost:5432/maison_du_pain
  AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  quality:
    name: Lint, tipos, testes unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Testes de integração (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maison
          POSTGRES_PASSWORD: maison_ci
          POSTGRES_DB: maison_du_pain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maison"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run test:int

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [quality, integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maison
          POSTGRES_PASSWORD: maison_ci
          POSTGRES_DB: maison_du_pain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maison"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:deploy
      - run: npm run db:seed
        env:
          SEED_DEMO_PASSWORD: Demo12345
      - run: npm run test:e2e
        env:
          CI: "true"
          E2E_ADMIN_EMAIL: admin@maisondupain.example
          E2E_ADMIN_PASSWORD: Demo12345
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
